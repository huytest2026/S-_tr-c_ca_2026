<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="utf-8">
  <title>Hệ Thống Quản Lý Ca Trực & Sự Cố Cáp Quang</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    body { font-family: Arial, sans-serif; margin: 0; padding: 20px; background-color: #f4f6f9; color: #333; }
    .container { max-width: 1250px; margin: 0 auto; background: #fff; padding: 25px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
    
    /* Tab Header styling */
    .tab-header { display: flex; border-bottom: 2px solid #ddd; margin-bottom: 25px; flex-wrap: wrap; gap: 5px; }
    .tab-btn { padding: 12px 20px; cursor: pointer; background: #e9ecef; border: none; border-top-left-radius: 6px; border-top-right-radius: 6px; font-weight: bold; font-size: 14px; color: #495057; outline: none; transition: all 0.2s; }
    .tab-btn.active { background: #1976d2; color: white; box-shadow: 0 -2px 5px rgba(0,0,0,0.1); }
    .tab-content { display: none; }
    .tab-content.active { display: block; }
    
    .form-row { display: flex; gap: 15px; margin-bottom: 15px; flex-wrap: wrap; }
    .form-group { flex: 1; min-width: 220px; }
    label { display: block; margin-bottom: 6px; font-weight: bold; color: #333; font-size: 14px; }
    input, select, textarea { width: 100%; padding: 10px 12px; box-sizing: border-box; border: 1px solid #ced4da; border-radius: 4px; font-size: 14px; background: #fff; }
    input:focus, select:focus, textarea:focus { border-color: #1976d2; outline: none; box-shadow: 0 0 0 3px rgba(25,118,210,0.15); }
    
    .btn-action { 
      background: linear-gradient(135deg, #1976d2, #1565c0); 
      color: white; 
      padding: 12px 28px; 
      border: none; 
      border-radius: 6px; 
      cursor: pointer; 
      font-weight: bold; 
      font-size: 16px; 
      box-shadow: 0 4px 8px rgba(25, 118, 210, 0.3); 
      transition: all 0.25s ease;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
    .btn-action:hover { 
      background: linear-gradient(135deg, #1565c0, #0d47a1); 
      box-shadow: 0 6px 12px rgba(25, 118, 210, 0.4);
      transform: translateY(-2px);
    }

    .btn-success-action {
      background: linear-gradient(135deg, #2e7d32, #1b5e20);
      box-shadow: 0 4px 8px rgba(46, 125, 50, 0.3);
    }
    .btn-success-action:hover {
      background: linear-gradient(135deg, #1b5e20, #103912);
      box-shadow: 0 6px 12px rgba(46, 125, 50, 0.4);
    }

    .header-box { border-bottom: 2px solid #eee; margin-bottom: 20px; padding-bottom: 8px; }
    .table-responsive { overflow-x: auto; margin-top: 15px; border-radius: 6px; border: 1px solid #e0e0e0; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; background: #fff; }
    th, td { border: 1px solid #e0e0e0; padding: 10px 12px; text-align: left; }
    th { background-color: #f8f9fa; color: #333; font-weight: bold; }
    tr:nth-child(even) { background-color: #fbfbfb; }
    .loading { color: #1976d2; font-style: italic; font-weight: bold; padding: 10px 0; }
    .map-link { color: #1976d2; text-decoration: underline; cursor: pointer; font-weight: bold; }
    
    #mapSuCoContainer { margin-top: 25px; display: none; }
    #mapSuCo { height: 480px; width: 100%; border-radius: 6px; border: 1px solid #ccc; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
    
    #mapSoHoaContainer { margin-top: 25px; display: none; }
    #mapSoHoa { height: 480px; width: 100%; border-radius: 6px; border: 1px solid #ccc; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
    
    .map-label-tag { background: transparent !important; border: none !important; box-shadow: none !important; font-size: 13px; font-weight: bold; color: #d32f2f !important; white-space: nowrap; text-shadow: 1px 1px 2px #fff, -1px -1px 2px #fff, 1px -1px 2px #fff, -1px 1px 2px #fff; }
    
    .checkbox-group { display: flex; align-items: center; gap: 10px; margin: 15px 0; background: #f8f9fa; padding: 12px 15px; border-radius: 6px; border: 1px solid #e9ecef; }
    .checkbox-group input[type="checkbox"] { width: 18px; height: 18px; cursor: pointer; }
    .checkbox-group label { margin-bottom: 0; cursor: pointer; font-weight: normal; font-size: 14px; }
  </style>
</head>
<body>
  <div class="container">
    <div class="tab-header">
      <button class="tab-btn active" onclick="openTab(event, 'tabGiaoCa')">📊 SỔ GIAO CA TRỰC</button>
      <button class="tab-btn" onclick="openTab(event, 'tabSuCo')">⚡ TRA CỨU SỰ CỐ</button>
      <button class="tab-btn" onclick="openTab(event, 'tabSoHoa')">🌐 SỔ HÓA CÁP QUANG</button>
      <button class="tab-btn" onclick="openTab(event, 'tabVatTu')">📦 THEO DÕI VẬT TƯ</button>
    </div>

    <!-- TAB 1: SỔ GIAO CA TRỰC -->
    <div id="tabGiaoCa" class="tab-content active">
      <div class="header-box">
        <h2 style="color: #1976d2; margin: 0;">NHẬT KÝ & BÀN GIAO CA TRỰC</h2>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Ngày giao ca:</label>
          <input type="date" id="gcNgayGiao">
        </div>
        <div class="form-group">
          <label>Ca trực:</label>
          <select id="gcCaTruc">
            <option value="Ca 1">Ca 1 (07:00 - 15:00)</option>
            <option value="Ca 2">Ca 2 (15:00 - 23:00)</option>
            <option value="Ca 3">Ca 3 (23:00 - 07:00)</option>
          </select>
        </div>
      </div>
      <button type="button" class="btn-action" onclick="loadShiftData()">📥 Tải Dữ Liệu Ca Trực</button>

      <form id="handoverForm" style="margin-top: 20px;" onsubmit="submitHandover(event)">
        <div class="form-row">
          <div class="form-group">
            <label>Người giao:</label>
            <select id="gcNguoiGiao" required></select>
          </div>
          <div class="form-group">
            <label>Người nhận:</label>
            <select id="gcNguoiNhan" required></select>
          </div>
        </div>
        <div class="form-group" style="margin-bottom: 15px;">
          <label>2.1. Công việc thường xuyên / Bảo dưỡng:</label>
          <textarea id="gcCongViecTX" rows="3"></textarea>
        </div>
        <div class="form-group" style="margin-bottom: 15px;">
          <label>2.2. Tình hình thông tin & sự cố:</label>
          <textarea id="gcNoiDungCV" rows="3"></textarea>
        </div>
        <div class="form-group" style="margin-bottom: 15px;">
          <label>2.4. Tồn tại cần xử lý:</label>
          <textarea id="gcTonTai" rows="3"></textarea>
        </div>
        <button type="submit" class="btn-action btn-success-action">💾 Lưu & Tạo Biên Bản Bàn Giao</button>
      </form>
      <div id="handoverResult" style="margin-top: 15px;"></div>
    </div>

    <!-- TAB 2: TRA CỨU SỰ CỐ -->
    <div id="tabSuCo" class="tab-content">
      <div class="header-box">
        <h2 style="color: #d32f2f; margin: 0;">TRA CỨU SỰ CỐ CÁP QUANG</h2>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Link:</label>
          <select id="scLink"><option value="">-- Tất cả Link --</option></select>
        </div>
        <div class="form-group">
          <label>Tuyến cáp:</label>
          <select id="scTuyenCap"><option value="">-- Tất cả Tuyến cáp --</option></select>
        </div>
        <div class="form-group">
          <label>Khoảng cách đo OTDR (km):</label>
          <input type="text" id="scOtdr" placeholder="Ví dụ: 12.345">
        </div>
      </div>

      <div class="checkbox-group">
        <input type="checkbox" id="scOnlyNearest" checked>
        <label for="scOnlyNearest">
          <b>Chỉ hiển thị điểm sự cố gần nhất khớp với thông số OTDR</b> 
          <span style="color: #d32f2f; font-weight: bold; margin-left: 5px;">(Tìm điểm gần nhất)</span>
        </label>
      </div>

      <button type="button" class="btn-action" onclick="doSearchSuCo()">🔍 TRA CỨU SỰ CỐ</button>

      <div id="mapSuCoContainer">
        <h3 id="mapSuCoTitle" style="color: #d32f2f; margin-bottom: 8px;">⚡ BẢN ĐỒ SỰ CỐ CÁP QUANG</h3>
        <div id="mapSuCo"></div>
      </div>

      <div id="suCoResult" style="margin-top: 15px;"></div>
    </div>

    <!-- TAB 3: SỔ HÓA CÁP QUANG -->
    <div id="tabSoHoa" class="tab-content">
      <div class="header-box">
        <h2 style="color: #2e7d32; margin: 0;">TRA CỨU DỮ LIỆU SỔ HÓA CÁP QUANG</h2>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Link:</label>
          <select id="shLink"><option value="">-- Tất cả Link --</option></select>
        </div>
        <div class="form-group">
          <label>Tuyến cáp:</label>
          <select id="shTuyenCap"><option value="">-- Tất cả Tuyến cáp --</option></select>
        </div>
        <div class="form-group">
          <label>Từ khóa tìm kiếm (Đối tượng, Tại Km, Ghi chú...):</label>
          <input type="text" id="shKeyword" placeholder="Nhập từ khóa cần tìm...">
        </div>
      </div>
      
      <button type="button" class="btn-action btn-success-action" onclick="doSearchSoHoa()">🔍 TRA CỨU SỔ HÓA</button>

      <div id="mapSoHoaContainer">
        <h3 id="mapSoHoaTitle" style="color: #2e7d32; margin-bottom: 8px;">📖 BẢN ĐỒ SỔ HÓA CÁP QUANG</h3>
        <div id="mapSoHoa"></div>
      </div>

      <div id="soHoaResult"></div>
    </div>

    <!-- TAB 4: THEO DÕI VẬT TƯ -->
    <div id="tabVatTu" class="tab-content">
      <div class="header-box">
        <h2 style="color: #e65100; margin: 0;">TRA CỨU VẬT TƯ VẬN HÀNH</h2>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Lĩnh vực:</label>
          <select id="vtLinhVuc" onchange="filterVatTuByLinhVuc()">
            <option value="">-- Tất cả Lĩnh vực --</option>
          </select>
        </div>
        <div class="form-group">
          <label>Tên tắt / Tên vật tư:</label>
          <input type="text" id="vtKeyword" placeholder="Nhập tên vật tư cần tìm..." oninput="doSearchVatTuLocal()">
        </div>
      </div>
      <button type="button" class="btn-action" style="background: linear-gradient(135deg, #ef6c00, #e65100);" onclick="doSearchVatTuLocal()">🔍 TRA CỨU VẬT TƯ</button>
      <div id="vatTuResult" style="margin-top: 15px;"></div>
    </div>
  </div>

  <script>
    var globalVatTuData = [];
    var mapInstanceSuCo = null;
    var markersLayerSuCo = null;
    var mapInstanceSoHoa = null;
    var markersLayerSoHoa = null;

    function openTab(evt, tabName) {
      var tabcontent = document.getElementsByClassName("tab-content");
      for (var i = 0; i < tabcontent.length; i++) tabcontent[i].classList.remove("active");
      var tablinks = document.getElementsByClassName("tab-btn");
      for (var i = 0; i < tablinks.length; i++) tablinks[i].classList.remove("active");
      
      document.getElementById(tabName).classList.add("active");
      if (evt && evt.currentTarget) {
        evt.currentTarget.classList.add("active");
      }
      
      if (mapInstanceSuCo && tabName === 'tabSuCo') {
        setTimeout(function() { mapInstanceSuCo.invalidateSize(); }, 200);
      }
      if (mapInstanceSoHoa && tabName === 'tabSoHoa') {
        setTimeout(function() { mapInstanceSoHoa.invalidateSize(); }, 200);
      }
    }

    function populateSelect(selectId, list, defaultText) {
      var select = document.getElementById(selectId);
      if (!select) return;
      select.innerHTML = '<option value="">' + defaultText + '</option>';
      if (list && Array.isArray(list)) {
        list.forEach(function(item) {
          var opt = document.createElement('option');
          opt.value = item;
          opt.textContent = item;
          select.appendChild(opt);
        });
      }
    }

    function formatToaDoCell(toaDoStr) {
      if (!toaDoStr || !toaDoStr.toString().trim()) return '';
      var cleanStr = toaDoStr.toString().trim();
      if (cleanStr.includes(',')) {
        var parts = cleanStr.split(',');
        if (parts.length >= 2) {
          var lat = parts[0].trim();
          var lng = parts[1].trim();
          if (!isNaN(lat) && !isNaN(lng)) {
            var mapUrl = 'https://www.google.com/maps?q=' + lat + ',' + lng;
            return '<a href="' + mapUrl + '" target="_blank" class="map-link" title="Xem trên Google Maps">' + cleanStr + ' 🗺️</a>';
          }
        }
      }
      return cleanStr;
    }

    window.onload = function() {
      var today = new Date().toISOString().split('T')[0];
      var dateInput = document.getElementById('gcNgayGiao');
      if (dateInput) dateInput.value = today;

      google.script.run
        .withSuccessHandler(function(res) {
          if (res && res.success) {
            if (res.staffList) {
              populateSelect('gcNguoiGiao', res.staffList, '-- Chọn người giao --');
              populateSelect('gcNguoiNhan', res.staffList, '-- Chọn người nhận --');
            }
            if (res.linkList) {
              populateSelect('scLink', res.linkList, '-- Tất cả Link --');
              populateSelect('shLink', res.linkList, '-- Tất cả Link --');
            }
            if (res.tuyenCapList) {
              populateSelect('scTuyenCap', res.tuyenCapList, '-- Tất cả Tuyến cáp --');
              populateSelect('shTuyenCap', res.tuyenCapList, '-- Tất cả Tuyến cáp --');
            }
            if (res.linhVucList) {
              populateSelect('vtLinhVuc', res.linhVucList, '-- Tất cả Lĩnh vực --');
            }
            if (res.allVatTuData) {
              globalVatTuData = res.allVatTuData;
              renderVatTuTable(globalVatTuData);
            }
            if (res.lastHandover) {
              document.getElementById('gcCongViecTX').value = res.lastHandover.congViecThuongXuyen || '';
              document.getElementById('gcNoiDungCV').value = res.lastHandover.noiDungCongViec || '';
              document.getElementById('gcTonTai').value = res.lastHandover.noiDungTonTai || '';
              if (res.lastHandover.nguoiGiao) document.getElementById('gcNguoiGiao').value = res.lastHandover.nguoiGiao;
              if (res.lastHandover.nguoiNhan) document.getElementById('gcNguoiNhan').value = res.lastHandover.nguoiNhan;
            }
          } else {
            alert("Lỗi khởi tạo dữ liệu: " + (res ? res.error : "Không phản hồi từ Server"));
          }
        })
        .withFailureHandler(function(err) {
          alert("Lỗi kết nối Server: " + err.message);
        })
        .getInitialData();
    };

    function loadShiftData() {
      var ngayGiao = document.getElementById('gcNgayGiao').value;
      var caTruc = document.getElementById('gcCaTruc').value;
      if (!ngayGiao) {
        alert("Vui lòng chọn ngày giao ca!");
        return;
      }
      google.script.run
        .withSuccessHandler(function(res) {
          if (res.success) {
            if (res.found && res.data) {
              document.getElementById('gcNguoiGiao').value = res.data.nguoiGiao || '';
              document.getElementById('gcNguoiNhan').value = res.data.nguoiNhan || '';
              document.getElementById('gcCongViecTX').value = res.data.congViecThuongXuyen || '';
              document.getElementById('gcNoiDungCV').value = res.data.noiDungCongViec || '';
              document.getElementById('gcTonTai').value = res.data.noiDungTonTai || '';
              document.getElementById('handoverResult').innerHTML = '<p style="color: green; font-weight: bold;">✅ Đã tải thành công dữ liệu ca trực cũ.</p>';
            } else {
              document.getElementById('handoverResult').innerHTML = '<p style="color: orange; font-weight: bold;">⚠️ ' + res.message + '</p>';
            }
          } else {
            alert("Lỗi: " + res.error);
          }
        })
        .withFailureHandler(function(err) {
          alert("Lỗi kết nối: " + err.message);
        })
        .getShiftData(ngayGiao, caTruc);
    }

    function submitHandover(e) {
      e.preventDefault();
      var formData = {
        ngayGiao: document.getElementById('gcNgayGiao').value,
        caTruc: document.getElementById('gcCaTruc').value,
        nguoiGiao: document.getElementById('gcNguoiGiao').value,
        nguoiNhan: document.getElementById('gcNguoiNhan').value,
        congViecThuongXuyen: document.getElementById('gcCongViecTX').value,
        noiDungCongViec: document.getElementById('gcNoiDungCV').value,
        noiDungTonTai: document.getElementById('gcTonTai').value
      };
      
      document.getElementById('handoverResult').innerHTML = '<p class="loading">⏳ Đang tạo biên bản bàn giao ca trực...</p>';

      google.script.run
        .withSuccessHandler(function(res) {
          if (res.success) {
            var html = '<p style="color: green; font-weight: bold;">🎉 Tạo biên bản bàn giao thành công!</p>';
            html += '<p><a href="' + res.url + '" target="_blank" class="map-link">📄 Xem Google Doc Biên Bản</a> | ';
            if (res.pdfUrl) {
              html += '<a href="' + res.pdfUrl + '" target="_blank" class="map-link">📥 Tải File PDF</a></p>';
            }
            document.getElementById('handoverResult').innerHTML = html;
          } else {
            document.getElementById('handoverResult').innerHTML = '<p style="color: red; font-weight: bold;">❌ Lỗi: ' + res.error + '</p>';
          }
        })
        .withFailureHandler(function(err) {
          document.getElementById('handoverResult').innerHTML = '<p style="color: red; font-weight: bold;">❌ Lỗi kết nối: ' + err.message + '</p>';
        })
        .processHandover(formData);
    }

    function doSearchSuCo() {
      var link = document.getElementById('scLink').value;
      var tuyenCap = document.getElementById('scTuyenCap').value;
      var otdr = document.getElementById('scOtdr').value;
      var onlyNearest = document.getElementById('scOnlyNearest').checked;
      var resultDiv = document.getElementById('suCoResult');
      var mapContainer = document.getElementById('mapSuCoContainer');

      resultDiv.innerHTML = '<p class="loading">⏳ Đang tra cứu sự cố...</p>';
      mapContainer.style.display = 'none';

      google.script.run
        .withSuccessHandler(function(res) {
          if (res.success) {
            if (!res.data || res.data.length === 0) {
              resultDiv.innerHTML = '<p style="color: red; font-weight: bold;">⚠️ Không tìm thấy điểm sự cố phù hợp.</p>';
              return;
            }

            var html = '<div class="table-responsive"><table><thead><tr>' +
              '<th>ID</th><th>Trạm QL</th><th>Tuyến Cáp</th><th>Link</th><th>Đối Tượng</th><th>OTDR</th>' +
              '<th>Tại Km</th><th>Tọa Độ</th><th>Thời Gian</th><th>Mức Phụ Sóng (MX)</th><th>Mức Phụ Cáp</th>' +
              '</tr></thead><tbody>';

            var validCoords = [];

            res.data.forEach(function(row) {
              html += '<tr>' +
                '<td>' + (row.id || '') + '</td>' +
                '<td>' + (row.tramQL || '') + '</td>' +
                '<td>' + (row.tuyenCap || '') + '</td>' +
                '<td>' + (row.link || '') + '</td>' +
                '<td>' + (row.doiTuong || '') + '</td>' +
                '<td>' + (row.otdr || '') + '</td>' +
                '<td>' + (row.taiKm || '') + '</td>' +
                '<td>' + formatToaDoCell(row.toaDo) + '</td>' +
                '<td>' + (row.thoiGian || '') + '</td>' +
                '<td>' + (row.mxPs || '') + '</td>' +
                '<td>' + (row.mCapPs || '') + '</td>' +
                '</tr>';

              if (row.toaDo && row.toaDo.toString().trim() !== '') {
                var cleanToaDo = row.toaDo.toString().trim();
                if (cleanToaDo.includes(',')) {
                  var parts = cleanToaDo.split(',');
                  if (parts.length >= 2) {
                    var lat = parseFloat(parts[0].trim());
                    var lng = parseFloat(parts[1].trim());
                    if (!isNaN(lat) && !isNaN(lng) && lat >= -90 && lat <= 90 && lng >= -180 && lng <= 180 && !(lat === 0 && lng === 0)) {
                      validCoords.push({ lat: lat, lng: lng, info: row });
                    }
                  }
                }
              }
            });

            html += '</tbody></table></div>';
            resultDiv.innerHTML = html;

            if (validCoords.length > 0) {
              mapContainer.style.display = 'block';
              document.getElementById('mapSuCoTitle').textContent = '⚡ BẢN ĐỒ SỰ CỐ CÁP QUANG (' + validCoords.length + ' điểm có tọa độ)';

              setTimeout(function() {
                if (!mapInstanceSuCo) {
                  mapInstanceSuCo = L.map('mapSuCo').setView([validCoords[0].lat, validCoords[0].lng], 12);
                  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                    maxZoom: 19,
                    attribution: '© OpenStreetMap contributors'
                  }).addTo(mapInstanceSuCo);
                } else {
                  mapInstanceSuCo.invalidateSize();
                }

                if (markersLayerSuCo) {
                  mapInstanceSuCo.removeLayer(markersLayerSuCo);
                }
                markersLayerSuCo = L.layerGroup().addTo(mapInstanceSuCo);

                var bounds = [];
                validCoords.forEach(function(item) {
                  var marker = L.marker([item.lat, item.lng]).addTo(markersLayerSuCo);
                  var doiTuong = item.info.doiTuong || 'SC';
                  var taiKm = item.info.taiKm || '';
                  var labelText = doiTuong + '/' + (taiKm.toLowerCase().startsWith('km') ? taiKm : 'Km ' + taiKm);

                  marker.bindTooltip(labelText, { permanent: true, direction: 'right', className: 'map-label-tag' });

                  var popupContent = '<b>Tuyến:</b> ' + item.info.tuyenCap + ' (' + item.info.link + ')<br>' +
                                     '<b>Đối tượng:</b> ' + item.info.doiTuong + ' - ' + item.info.taiKm + '<br>' +
                                     '<b>Trạm QL:</b> ' + item.info.tramQL + '<br>' +
                                     '<b>OTDR:</b> ' + (item.info.otdr || '') + '<br>' +
                                     '<b>Tọa độ:</b> ' + item.info.toaDo;
                  marker.bindPopup(popupContent);
                  bounds.push([item.lat, item.lng]);
                });

                if (bounds.length > 0) {
                  mapInstanceSuCo.invalidateSize();
                  mapInstanceSuCo.fitBounds(bounds, { padding: [50, 50], maxZoom: 15 });
                }
              }, 300);
            }
          } else {
            resultDiv.innerHTML = '<p style="color: red;">❌ Lỗi: ' + res.error + '</p>';
          }
        })
        .withFailureHandler(function(err) {
          resultDiv.innerHTML = '<p style="color: red;">❌ Lỗi kết nối: ' + err.message + '</p>';
        })
        .searchSuCo(link, tuyenCap, otdr, onlyNearest);
    }

    function doSearchSoHoa() {
      var link = document.getElementById('shLink').value;
      var tuyenCap = document.getElementById('shTuyenCap').value;
      var keyword = document.getElementById('shKeyword').value;
      var resultDiv = document.getElementById('soHoaResult');
      var mapContainer = document.getElementById('mapSoHoaContainer');

      resultDiv.innerHTML = '<p class="loading">⏳ Đang tra cứu dữ liệu số hóa...</p>';
      mapContainer.style.display = 'none';

      google.script.run
        .withSuccessHandler(function(res) {
          if (res.success) {
            if (!res.data || res.data.length === 0) {
              resultDiv.innerHTML = '<p style="color: red; font-weight: bold;">⚠️ Không tìm thấy dữ liệu số hóa phù hợp.</p>';
              return;
            }

            var html = '<div class="table-responsive"><table><thead><tr>' +
              '<th>ID</th><th>Trạm QL</th><th>Tuyến Cáp</th><th>Link</th><th>Đối Tượng</th><th>OTDR</th>' +
              '<th>Độ Sâu</th><th>Tại Km</th><th>Tọa Độ</th><th>Thời Gian</th><th>Diễn Giải</th>' +
              '</tr></thead><tbody>';

            var validCoords = [];

            res.data.forEach(function(row) {
              html += '<tr>' +
                '<td>' + (row.id || '') + '</td>' +
                '<td>' + (row.tramQL || '') + '</td>' +
                '<td>' + (row.tuyenCap || '') + '</td>' +
                '<td>' + (row.link || '') + '</td>' +
                '<td>' + (row.doiTuong || '') + '</td>' +
                '<td>' + (row.otdr || '') + '</td>' +
                '<td>' + (row.doSau || '') + '</td>' +
                '<td>' + (row.taiKm || '') + '</td>' +
                '<td>' + formatToaDoCell(row.toaDo) + '</td>' +
                '<td>' + (row.thoiGian || '') + '</td>' +
                '<td>' + (row.dienGiai || '') + '</td>' +
                '</tr>';

              if (row.toaDo && row.toaDo.toString().trim() !== '') {
                var cleanToaDo = row.toaDo.toString().trim();
                if (cleanToaDo.includes(',')) {
                  var parts = cleanToaDo.split(',');
                  if (parts.length >= 2) {
                    var lat = parseFloat(parts[0].trim());
                    var lng = parseFloat(parts[1].trim());
                    if (!isNaN(lat) && !isNaN(lng) && lat >= -90 && lat <= 90 && lng >= -180 && lng <= 180 && !(lat === 0 && lng === 0)) {
                      validCoords.push({ lat: lat, lng: lng, info: row });
                    }
                  }
                }
              }
            });

            html += '</tbody></table></div>';
            resultDiv.innerHTML = html;

            if (validCoords.length > 0) {
              mapContainer.style.display = 'block';
              document.getElementById('mapSoHoaTitle').textContent = '📖 BẢN ĐỒ SỐ HÓA CÁP QUANG (' + validCoords.length + ' điểm có tọa độ)';

              setTimeout(function() {
                if (!mapInstanceSoHoa) {
                  mapInstanceSoHoa = L.map('mapSoHoa').setView([validCoords[0].lat, validCoords[0].lng], 12);
                  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                    maxZoom: 19,
                    attribution: '© OpenStreetMap contributors'
                  }).addTo(mapInstanceSoHoa);
                } else {
                  mapInstanceSoHoa.invalidateSize();
                }

                if (markersLayerSoHoa) {
                  mapInstanceSoHoa.removeLayer(markersLayerSoHoa);
                }
                markersLayerSoHoa = L.layerGroup().addTo(mapInstanceSoHoa);

                var bounds = [];
                validCoords.forEach(function(item) {
                  var marker = L.marker([item.lat, item.lng]).addTo(markersLayerSoHoa);
                  var doiTuong = item.info.doiTuong || 'MX';
                  var taiKm = item.info.taiKm || '';
                  var labelText = doiTuong + '/' + (taiKm.toLowerCase().startsWith('km') ? taiKm : 'Km ' + taiKm);

                  marker.bindTooltip(labelText, { permanent: true, direction: 'right', className: 'map-label-tag' });

                  var popupContent = '<b>Tuyến:</b> ' + item.info.tuyenCap + ' (' + item.info.link + ')<br>' +
                                     '<b>Đối tượng:</b> ' + item.info.doiTuong + ' - ' + item.info.taiKm + '<br>' +
                                     '<b>Trạm QL:</b> ' + item.info.tramQL + '<br>' +
                                     '<b>Tọa độ:</b> ' + item.info.toaDo;
                  marker.bindPopup(popupContent);
                  bounds.push([item.lat, item.lng]);
                });

                if (bounds.length > 0) {
                  mapInstanceSoHoa.invalidateSize();
                  mapInstanceSoHoa.fitBounds(bounds, { padding: [50, 50], maxZoom: 15 });
                }
              }, 300);
            }
          } else {
            resultDiv.innerHTML = '<p style="color: red;">❌ Lỗi: ' + res.error + '</p>';
          }
        })
        .withFailureHandler(function(err) {
          resultDiv.innerHTML = '<p style="color: red;">❌ Lỗi kết nối: ' + err.message + '</p>';
        })
        .searchSoHoa(link, tuyenCap, keyword);
    }

    function renderVatTuTable(dataList) {
      var resultDiv = document.getElementById('vatTuResult');
      if (!dataList || dataList.length === 0) {
        resultDiv.innerHTML = '<p style="color: red; font-weight: bold;">⚠️ Không tìm thấy vật tư phù hợp.</p>';
        return;
      }

      var html = '<div class="table-responsive"><table><thead><tr>' +
        '<th>Mã Kho</th><th>Tên Kho</th><th>Lô Hàng</th><th>Mã VT</th><th>Tên Vật Tư</th>' +
        '<th>Tên Tắt</th><th>Part Number</th><th>Serial</th><th>Lĩnh Vực</th>' +
        '</tr></thead><tbody>';

      dataList.forEach(function(row) {
        html += '<tr>' +
          '<td>' + (row.maKho || '') + '</td>' +
          '<td>' + (row.tenKho || '') + '</td>' +
          '<td>' + (row.loHang || '') + '</td>' +
          '<td>' + (row.maVt || '') + '</td>' +
          '<td>' + (row.tenVt || '') + '</td>' +
          '<td>' + (row.tenTat || '') + '</td>' +
          '<td>' + (row.partNumber || '') + '</td>' +
          '<td>' + (row.serial || '') + '</td>' +
          '<td>' + (row.linhVuc || '') + '</td>' +
          '</tr>';
      });

      html += '</tbody></table></div>';
      resultDiv.innerHTML = html;
    }

    function filterVatTuByLinhVuc() {
      doSearchVatTuLocal();
    }

    function doSearchVatTuLocal() {
      var linhVucVal = document.getElementById('vtLinhVuc').value;
      var keywordVal = document.getElementById('vtKeyword').value.toLowerCase().trim();

      var filtered = globalVatTuData.filter(function(item) {
        var matchLv = !linhVucVal || item.linhVuc === linhVucVal;
        var matchKw = !keywordVal || (item.tenTat && item.tenTat.toLowerCase().includes(keywordVal)) || 
                                     (item.tenVt && item.tenVt.toLowerCase().includes(keywordVal));
        return matchLv && matchKw;
      });

      renderVatTuTable(filtered);
    }
  </script>
</body>
</html>
